services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: job-copilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobcopilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobcopilot}
      POSTGRES_DB: ${POSTGRES_DB:-jobcopilot}
    ports:
      # Только localhost: БД не должна быть доступна из сети.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Скрипты из этой папки выполняются один раз, при первом создании volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
